[project]
name = "workbuddy2api"
version = "0.4.1"
description = "WorkBuddy2API：单用户专属 WorkBuddy API 网关，OpenAI Chat + Responses + Anthropic 三协议，多账号、SQLite、Vue3 WebUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "qrcode>=8.2",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
workbuddy2api = "workbuddy_one.__main__:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workbuddy_one"]

[tool.pytest.ini_options]
testpaths = ["tests"]
