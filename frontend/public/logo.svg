<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#1b2038"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#2a3254" stroke-width="2"/>

  <!-- 中心模型节点（六边形） -->
  <path d="M128 78 L166 100 L166 156 L128 178 L90 156 L90 100 Z" fill="url(#g)"/>
  <path d="M128 78 L166 100 L166 156 L128 178 L90 156 L90 100 Z" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>

  <!-- 三协议环绕节点（API hub：Chat / Responses / Anthropic） -->
  <circle cx="128" cy="48"  r="15" fill="url(#g2)"/>
  <circle cx="128" cy="208" r="15" fill="url(#g3)"/>
  <circle cx="48"  cy="128" r="15" fill="url(#g3)"/>
  <circle cx="208" cy="128" r="15" fill="url(#g2)"/>

  <!-- 连接线 -->
  <g stroke="#3a4266" stroke-width="8" stroke-linecap="round">
    <line x1="128" y1="63" x2="128" y2="78"/>
    <line x1="128" y1="178" x2="128" y2="193"/>
    <line x1="63" y1="128" x2="90" y2="128"/>
    <line x1="166" y1="128" x2="193" y2="128"/>
  </g>

  <!-- 中心白色高光 -->
  <circle cx="128" cy="128" r="10" fill="#ffffff"/>
</svg>
